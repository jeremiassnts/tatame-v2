# OpenTelemetry Collector — the single entry point for all telemetry.
# Apps push here over OTLP; the Collector decides where each signal is stored.
# Metrics go to Prometheus (pull); traces go to Tempo and logs go to Loki (both
# push). The applications only ever know this Collector.

receivers:
  otlp:
    protocols:
      # gRPC is the fast binary path used by the API SDK.
      grpc:
        endpoint: 0.0.0.0:4317
      # HTTP is kept open so you can poke the Collector with curl/Postman.
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Drops data instead of OOM-killing the Collector under a traffic spike.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # Groups points before export — fewer, larger writes.
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Exposes everything received as a Prometheus scrape target on :8889/metrics.
  # This endpoint is deliberately published in docker-compose so you can curl it
  # and see exactly what the API is producing, one hop before Prometheus.
  prometheus:
    endpoint: 0.0.0.0:8889
    # How long a series survives here after the API stops sending it. The default
    # is 5m; two minutes is what makes the "API not reporting" alert usable —
    # detection is this value plus the rule's `for`, and 5m + 3m is a long time to
    # not know the API is down.
    #
    # Safe to shorten because the SDK re-exports every series on each interval
    # (30s in production) whether or not anything changed, so two minutes is four
    # missed exports, not a quiet period. Raising it again would slow the alert,
    # not just the dashboards.
    metric_expiration: 2m
    # Copies a few resource attributes onto every series as labels, so dashboards
    # can filter by service and environment. Deliberately an explicit list —
    # `["*"]` also drags in process.command_args, host.id, executable paths and
    # friends, which bloat every series for no benefit.
    resource_constant_labels:
      included:
        - service.name
        - service.namespace
        - service.instance.id
        - deployment.environment.name
  # Traces are pushed to Tempo over the compose network. Tempo's own OTLP port is
  # not published on the host — 4317 there is this Collector's receiver.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      # Plaintext inside the compose network; there is no CA to verify against.
      insecure: true
  # Logs are pushed to Loki's *native OTLP* endpoint. There is no `loki` exporter
  # to use instead: this distribution ships `loki` only as a receiver, which is
  # what `docker run --entrypoint /otelcol-contrib <image> components` reports.
  # The path suffix matters — `/otlp` is the base, and the exporter appends
  # `/v1/logs` to it.
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      # Plaintext inside the compose network; there is no CA to verify against.
      insecure: true
  # There is deliberately no `debug` exporter. It printed a line per batch into the
  # container log, which is noise in production and tells you nothing the other
  # hops do not — export *failures* are logged by the exporters themselves, so
  # `docker logs <collector> | grep -i loki` still works without it. Add it back
  # to a pipeline temporarily when you need to see what is arriving.

service:
  telemetry:
    logs:
      level: info
    metrics:
      # The Collector's own metrics — `otelcol_exporter_send_failed_*` and
      # friends — on :8888. Since v0.113 the default binding is localhost, which
      # inside a container means the endpoint exists and nothing can reach it, so
      # the address has to be spelled out. Prometheus scrapes this as the
      # `otel-collector-internal` job; the "Collector failing to export
      # telemetry" alert has no other source.
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
