# Prometheus pulls. It scrapes the Collector's /metrics endpoint on a timer and
# stores every sample in its local TSDB. Grafana then queries Prometheus.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Everything the API pushed into the Collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    # `target_info` is the one series that does not carry service_name /
    # service_namespace. The Collector's prometheus exporter follows the
    # OTLP-to-Prometheus spec and collapses service.namespace + service.name into
    # `job` there (and service.instance.id into `instance`); Prometheus then
    # renames both, because its own scrape labels already own those names. So it
    # arrives as `exported_job="tatame/tatame-api"` with no service labels, while
    # every other series gets them from `resource_constant_labels`.
    #
    # These rules put the two labels back. `target_info` exists whether or not the
    # service is handling traffic, which is what makes it the right source for a
    # dashboard's service picker — a picker built on request metrics empties out
    # the moment the service goes idle.
    metric_relabel_configs:
      # The namespace group is optional: a service with no service.namespace
      # exposes `job="<name>"`, and an empty replacement drops the label.
      - source_labels: [__name__, exported_job]
        regex: "target_info;(?:([^/]+)/)?(.+)"
        target_label: service_namespace
        replacement: "${1}"
      - source_labels: [__name__, exported_job]
        regex: "target_info;(?:([^/]+)/)?(.+)"
        target_label: service_name
        replacement: "${2}"

  # The Collector's own health, which is a different endpoint from the one above:
  # 8889 is the data it re-exports for the API, 8888 is how it is doing. This is
  # where `otelcol_exporter_send_failed_*` lives, and the
  # "Collector failing to export telemetry" alert reads nothing else.
  #
  # It is not exposed by default — since v0.113 the Collector binds its internal
  # metrics to localhost, which inside a container means nothing else can reach
  # them. `service.telemetry.metrics.readers` in otel-collector-config.yml opens
  # it to 0.0.0.0; without that block this target is permanently down.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # The three stores, scraped only so that `up` exists for them. None of their
  # series is on a dashboard — the point is the "Observability component down"
  # alert, which cannot fire for a target Prometheus was never told about.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # Grafana exposes /metrics unauthenticated by default. Scraping it closes the
  # loop on paper only: if Grafana is the thing that is down, the alert about it
  # has no way out. Worth having anyway for the flapping case.
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # Prometheus scraping itself — handy to confirm the server is alive.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
