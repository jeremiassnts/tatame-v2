apiVersion: 1

groups:
  - orgId: 1
    name: tatame-api-alerts
    folder: Tatame
    interval: 1m
    rules:
      - uid: high-error-rate
        title: "High Error Rate"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: >
                sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                /
                sum(rate(http_server_request_duration_seconds_count[5m]))
                * 100
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [A]
        for: 5m
        annotations:
          summary: "Error rate above 5% for 5 minutes"
        labels:
          severity: critical

      - uid: high-latency-p95
        title: "High Latency (p95)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: >
                histogram_quantile(0.95,
                  sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le)
                )
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
                  operator:
                    type: and
                  query:
                    params: [A]
        for: 5m
        annotations:
          summary: "API p95 latency above 2s for 5 minutes"
        labels:
          severity: warning

      - uid: service-down
        title: "Service Down"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: Prometheus
            model:
              expr: "up{job=\"otel-collector\"}"
              instant: true
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
        for: 1m
        annotations:
          summary: "API service appears down (no metrics received for 1 minute)"
        labels:
          severity: critical
