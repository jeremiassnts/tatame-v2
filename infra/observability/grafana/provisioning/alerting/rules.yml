# The alert rules. Provisioned, which means they are not editable from the
# Grafana UI — a threshold change is a commit, not a click. That is the intended
# trade: the rules are reviewable and they survive a rebuilt volume.
#
# Three conventions run through every rule below.
#
# `$labels` / `$value` are written plain, *not* escaped as `$$`. Grafana's docs
# say provisioning interpolates `$VAR` from the environment and that a literal
# dollar must be doubled — true for contact-point settings (which is how
# `$ALERT_EMAIL_TO` works in contact-points.yml) and not true here. Rule
# annotations are read as a plain string map with no expansion step, so `$$labels`
# is stored as `$$labels` and renders as garbage in the email. Verified by
# provisioning it both ways and reading the result back from
# `GET /api/v1/provisioning/alert-rules`.
#
# A, B — every rule is the same two stages: A asks the datasource for one number
# *right now*, B compares it to the threshold. `condition: B` names the stage that
# decides. Written out per rule rather than hidden behind a shared anchor, because
# the model blobs are what an exported rule looks like and matching that shape
# keeps them diffable against `GET /api/v1/provisioning/alert-rules/export`.
#
# Every A is an **instant** query — `instant: true` for Prometheus,
# `queryType: instant` for Loki — and there is deliberately no `reduce` stage. The
# obvious alternative, a range query reduced with `last`, resolves late and in one
# case never: `reduce` with `mode: dropNN` skips the empty tail of a series and
# returns the last value that existed, so a condition that stopped being true ten
# minutes ago still reads as true until it scrolls out of the window. For
# `absent()` that is not a delay but an inversion — the healthy state produces no
# points at all, which is exactly the tail `dropNN` skips over. Measured: the
# instant query read healthy while the 10m range query still returned `1` from
# nine minutes earlier. The smoothing lives where it belongs instead — in the
# LogQL/PromQL window and in `for`.
apiVersion: 1

groups:
  - orgId: 1
    name: tatame-critical
    folder: Tatame Alerts
    # Evaluated once a minute. Every `for` below is a whole number of minutes so
    # it lands on an evaluation.
    interval: 1m
    rules:
      # ── The API ───────────────────────────────────────────────────────────
      - uid: tatame-api-down
        title: API not reporting
        # `target_info` is the one series that exists whether or not the service
        # is handling traffic, which makes it the honest "is it alive" signal —
        # a request-rate check cannot tell a dead API from a quiet night.
        #
        # The API pushes to the Collector; nothing scrapes it, so there is no
        # `up` series for it. What replaces `up == 0` is the Collector's
        # prometheus exporter forgetting a series it has stopped receiving:
        # `metric_expiration: 2m` in otel-collector-config.yml. Two minutes of
        # silence plus the 3m `for` below is a six-minute detection window —
        # measured, not estimated: telemetry stopped at 13:17:16, pending at
        # 13:20:17, firing at 13:23:17, email at 13:23:58.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: absent(target_info{service_namespace="tatame",service_name="tatame-api"})
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: A
              refId: B
              type: threshold
        # `absent()` returns *nothing* while the series exists, so "no data" here
        # is the healthy case. This is the one rule where that inversion holds;
        # every other rule below uses OK for the ordinary reason.
        noDataState: OK
        execErrState: Alerting
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: The API has stopped sending telemetry
          description: >-
            No `target_info` for tatame-api in Prometheus for over 3 minutes. Either
            the API is down, it crashed before the SDK started, or it can no longer
            reach the Collector. Check the API container first, then look for
            `[otel] metrics exporting to ...` in its boot log.

      - uid: tatame-api-5xx
        title: API returning 5xx
        # Deliberately the HTTP metric and not the `request.failed` event. The
        # error handler returns early for `HttpError`, so a 502 from Asaas
        # never emits that event — it is still a 5xx to the caller, and this
        # counter sees every one of them regardless of how it was produced.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(http_server_request_duration_seconds_count{service_name="tatame-api",http_response_status_code=~"5.."}[5m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
              expression: A
              refId: B
              type: threshold
        # No 5xx metric at all means no traffic, or an API that is gone — the
        # rule above owns that case, and duplicating it here would send two
        # emails for one incident.
        noDataState: OK
        execErrState: OK
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: More than 5 server errors in the last 5 minutes
          description: >-
            {{ $value }} responses with a 5xx status in a five-minute window, held
            for two minutes. The stacks for the ones the code did not expect are in
            Loki: {service_name="tatame-api"} | event_name="request.failed". A 5xx
            that is *not* there was raised deliberately as an HttpError — check the
            status-code panel on the "Tatame API — overview" dashboard to see which.

      - uid: tatame-api-5xx-ratio
        title: API 5xx ratio above 20%
        # The companion to the rule above, for the case it cannot see: low
        # traffic where almost everything fails. Six errors out of six requests
        # never crosses a count threshold of 5, but it is a total outage.
        #
        # The `and` clause is a traffic floor. Without it, one failed request at
        # 04:00 is a 100% error rate and an email.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: |-
                100 * sum(rate(http_server_request_duration_seconds_count{service_name="tatame-api",http_response_status_code=~"5.."}[5m]))
                    / sum(rate(http_server_request_duration_seconds_count{service_name="tatame-api"}[5m]))
                  and sum(rate(http_server_request_duration_seconds_count{service_name="tatame-api"}[5m])) > 0.05
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [20]
                    type: gt
              expression: A
              refId: B
              type: threshold
        # Below the traffic floor the query returns nothing, which is the normal
        # state of a quiet night.
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: One request in five is failing
          description: >-
            {{ $value }}% of requests returned 5xx over five minutes, with at least
            0.05 req/s of traffic. At this ratio the API is effectively down for
            users even if the absolute error count is small.

      # ── Money ─────────────────────────────────────────────────────────────
      - uid: tatame-payment-not-recorded
        title: Student payment received and not recorded
        # The only rule here with a threshold of zero, and the reason is that a
        # single occurrence is already a real loss: the provider took the money
        # and no payment row was written, so the student shows as overdue until
        # somebody reconciles by hand. Nothing else reports it — the webhook
        # route answers 200 and the provider considers it delivered.
        #
        # `for: 5m` still holds, and costs nothing: `count_over_time` over a
        # fifteen-minute window keeps a single occurrence above the threshold for
        # fifteen minutes, so one lost payment does send the email.
        #
        # `NO_PENDING_CHARGE` is the reason a lost student payment reports since
        # the TAT-104 cutover. The rail it replaced had its own spelling, and for
        # one release this query matched only that one — so the rule went quiet
        # exactly when the new rail became the only one the app calls.
        # `catalog-coverage.test.ts` reads the `expr:` lines and fails if a money
        # reason in the catalog is missing from them, which is what would have
        # caught it. TAT-187 removed the retired spelling from both.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="payment.webhook_unhandled" | event_reason=~"NO_PENDING_CHARGE|MISSING_REFERENCE" [15m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A payment was taken and no record of it was written
          description: >-
            {{ $value }} paid webhook(s) in fifteen minutes that could not be tied
            to anything of ours — an Asaas charge with no pending row
            (`NO_PENDING_CHARGE`), or a completed Stripe session with no metadata
            (`MISSING_REFERENCE`). The money is with the provider and the student
            is still marked overdue. Reconcile by hand against the provider
            dashboard. Query, with the ids:
            {service_name="tatame-api"} | event_name="payment.webhook_unhandled"

      - uid: tatame-payment-emails-skipped
        title: Payment recorded but its emails were skipped
        # Softer sibling of the rule above: the payment landed, and the student or
        # academy it points at could not be loaded, so the confirmation never
        # went out. Not a lost payment — a referential hole. Warning, and a
        # threshold above one, because a single occurrence is more likely a
        # deleted account than a broken system.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="payment.webhook_unhandled" | event_reason=~"USER_OR_ACADEMY_NOT_FOUND|OWNER_NOT_FOUND" [30m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Confirmation emails were skipped for recorded payments
          description: >-
            {{ $value }} payments in thirty minutes whose student, academy or
            manager could not be loaded, so the confirmation email was not sent.
            The payment rows exist; the people they point at do not. `app.cause`
            on each event says which email was lost.

      - uid: tatame-payment-charge-failed
        title: Students cannot open a payment
        # The student-facing half of the money path, which had no event before
        # TAT-104. `payment.charge_failed` is one broad signal by design, with
        # the Asaas code and sentence in `extra` — the causes are Asaas's to
        # invent (no Pix key on the root account yet, the 60-day evaluation cap,
        # a document it did not like) and enumerating them here would always be
        # one release behind.
        #
        # Threshold above three, because a single failure is usually one
        # student's own data being refused with a 400. A burst is the rail
        # itself: with the card rail off, nobody can pay at all.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="payment.charge_failed" [15m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 3 students failed to open a charge in 15 minutes
          description: >-
            {{ $value }} `payment.charge_failed` events in fifteen minutes. Pix is
            the only rail the app offers, so this is students unable to pay at
            all. `app.asaas.code` and `app.asaas.message` on each event carry what
            Asaas said; check first whether the root account still has a Pix key
            and whether the evaluation caps were hit. Query:
            {service_name="tatame-api"} | event_name="payment.charge_failed"

      - uid: tatame-payment-reversed
        title: Money went back out of an academy wallet
        # Threshold of zero, like the lost-payment rule, and for a related
        # reason: the split means the platform nets nothing on these charges, so
        # a refund or chargeback comes out of the *academy's* wallet and nothing
        # else in the system tells anyone. Warning rather than critical because
        # a refund is a normal thing a manager can ask Asaas for — but they
        # should not be the last to know it happened.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="payment.reversed" [30m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A payment was refunded or charged back
          description: >-
            {{ $value }} `payment.reversed` event(s) in thirty minutes. The split
            already paid the academy, so the money comes back out of their
            wallet, not ours. `app.type` says whether it was a refund or which
            stage of a chargeback, and `app.splitCancellationReason` says what
            Asaas did to the split. Query:
            {service_name="tatame-api"} | event_name="payment.reversed"

      - uid: tatame-payment-duplicate-month
        title: A student paid the same month twice
        # Zero threshold because each occurrence needs a person: the money is
        # not lost — the split put it in the academy's wallet — but the student
        # paid a month they had already paid, and only a human can decide
        # whether that gets refunded. Usually a manual confirmation landed first
        # and `cancelCheckout` could not tell an already-paid session from an
        # expired one, so the charge still arrived.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="payment.webhook_unhandled" | event_reason="DUPLICATE_MONTH" [30m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A student was charged twice for one reference month
          description: >-
            {{ $value }} paid webhook(s) in thirty minutes for a month that
            already had a payment row. Nothing was lost and nothing was written
            twice, but somebody paid twice and has to be told whether they are
            getting it back. The event carries the academy and payment ids.
            Query:
            {service_name="tatame-api"} | event_name="payment.webhook_unhandled" | event_reason="DUPLICATE_MONTH"

      - uid: tatame-payment-foreign-account
        title: Payment webhooks arriving from another Asaas account
        # Always a misconfiguration — the same webhook url or token set in two
        # environments — and it is dangerous in the direction that is invisible
        # from here: whichever environment *sent* the delivery recorded nothing,
        # so its students show as overdue while this one quietly rejects their
        # payments. Zero threshold, because one delivery already proves the
        # misconfiguration exists.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="payment.webhook_unhandled" | event_reason="FOREIGN_ACCOUNT" [30m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A payment delivery came from an Asaas account that is not ours
          description: >-
            {{ $value }} delivery(ies) in thirty minutes whose Asaas account id
            did not match this environment's root account. Two environments are
            sharing a webhook url or token. Check which one, because the sender
            recorded no payment for those students. Query:
            {service_name="tatame-api"} | event_name="payment.webhook_unhandled" | event_reason="FOREIGN_ACCOUNT"

      - uid: tatame-subscription-payment-failing
        title: Pro subscription payments failing
        # `manager_subscription.past_due` carries reason PAYMENT_FAILED and is
        # the manager side of a failed payment. The student side used to have no
        # event at all — every `payment.*` entry was an `outcome: success` —
        # which is no longer true: TAT-104 added `payment.charge_failed` and
        # `payment.reversed`, and both have rules of their own above.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="manager_subscription.past_due" [15m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 3 subscriptions went past due in 15 minutes
          description: >-
            {{ $value }} `manager_subscription.past_due` events in a fifteen-minute
            window. A handful is ordinary churn; a burst usually means Stripe is
            rejecting cards for a reason that is not the cards — a bad price, an
            expired API key, or a webhook replay. Query:
            {service_name="tatame-api"} | event_name="manager_subscription.past_due"

      - uid: tatame-stripe-webhooks-ignored
        title: Stripe webhooks received and ignored
        # UNKNOWN_EVENT_TYPE is filtered out on purpose: Stripe sends dozens of
        # event types the handler has no reason to care about, and counting them
        # would make this rule fire forever. What is left — NO_ACADEMY_OR_USER,
        # USER_NOT_FOUND, NO_RECORD — is a webhook we *meant* to handle and could
        # not match to a row, which is a real data problem.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: sum(count_over_time({service_name="tatame-api"} | event_name="manager_subscription.webhook_unhandled" | event_reason!="UNKNOWN_EVENT_TYPE" [30m]))
              intervalMs: 60000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [3]
                    type: gt
              expression: A
              refId: B
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Stripe webhooks could not be matched to an academy or user
          description: >-
            {{ $value }} `manager_subscription.webhook_unhandled` events in thirty
            minutes, excluding UNKNOWN_EVENT_TYPE. Each one is a subscription change
            Stripe told us about and we dropped. Query, with the reason:
            {service_name="tatame-api"} | event_name="manager_subscription.webhook_unhandled"

      # ── The stack itself ──────────────────────────────────────────────────
      - uid: tatame-stack-target-down
        title: Observability component down
        # `min by (job, instance)` rather than `up == 0`: the comparison form
        # returns an empty result while everything is healthy, which makes the
        # healthy state indistinguishable from a broken Prometheus. This form
        # always returns one series per target, so NoData means something is
        # wrong with Prometheus itself — and that is worth an email too.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min by (job, instance) (up)
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [1]
                    type: lt
              expression: A
              refId: B
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape {{ $labels.job }}
          description: >-
            The `{{ $labels.job }}` target at {{ $labels.instance }} has been
            unreachable for five minutes. Telemetry from that component is being
            lost for as long as this lasts. Grafana itself being the down target is
            the one case this cannot tell you about — the email would not be sent.

      - uid: tatame-collector-export-failing
        title: Collector failing to export telemetry
        # The Collector accepts data from the API and then fails to hand it on to
        # Tempo or Loki — the silent failure mode where everything looks up and
        # the dashboards slowly empty. The `(_total)?` in the matcher is not
        # hedging: whether the scraped name carries the suffix depends on the
        # Collector's internal-telemetry version, and matching both costs nothing.
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_(spans|log_records|metric_points)(_total)?"}[5m]))
              instant: true
              intervalMs: 60000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
              expression: A
              refId: B
              type: threshold
        # A Collector that has never failed to export exposes no failure series.
        noDataState: OK
        execErrState: OK
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: The Collector cannot deliver to {{ $labels.exporter }}
          description: >-
            `{{ $labels.exporter }}` has been dropping telemetry for ten minutes.
            The destination — Tempo for spans, Loki for logs — is refusing the push
