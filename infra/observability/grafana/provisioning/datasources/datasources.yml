# Provisioned at startup so there is nothing to click through in the UI.
# The `uid` is fixed because dashboard JSON references it by uid — a mismatch
# here is the classic reason a provisioned dashboard shows "No data".
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # Matches Prometheus' scrape_interval so $__rate_interval behaves.
      timeInterval: 5s

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      # Streams partial TraceQL results instead of blocking on the full query.
      # Requires `stream_over_http_enabled: true` in infra/observability/tempo.yml.
      streamingEnabled:
        search: true
      # Turns the trace's span attributes into links back into Prometheus, so a
      # slow span is one click from the RED panels for the same service.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service_name
      # The other half of the correlation: from a span, jump to the logs written
      # while it was open. `filterByTraceID` makes Grafana add the span's trace id
      # to the generated LogQL, and `tags` scopes it to the same service so the
      # query does not scan every stream in Loki.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service_name

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Logs -> trace. This is the one the previous observability stack got wrong
      # (see `62b4051`): it used a regex over the log line, and OTLP logs never
      # put the trace id in the line. It arrives as a record field, which Loki
      # stores as structured metadata — so the matcher has to be `label`, and
      # `matcherRegex` then holds the field *name*, not a pattern.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          # `$` is escaped as `$$` — provisioning interpolates environment
          # variables, and `${__value.raw}` is a Grafana token, not one of them.
          url: "$${__value.raw}"
          urlDisplayLabel: View trace
