# Local observability stack — opt-in, no auth, dev only.
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Data path: apps/api --OTLP/gRPC--> otel-collector -+- scrape -> prometheus -> grafana
#                                                    +- OTLP ---> tempo ------> grafana
#                                                    `- OTLP ---> loki -------> grafana
# See docs/observability.md.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — where the API pushes
      - "4318:4318" # OTLP HTTP — for manual pokes
      - "8889:8889" # Prometheus scrape endpoint — curl this to debug
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yml"]
    # The image runs as uid 10001, but a freshly created named volume is owned by
    # root — Tempo would fail to write its WAL. Dev stack, so just run as root
    # rather than bolting on an init container to chown the volume.
    user: "0"
    volumes:
      - ./infra/observability/tempo.yml:/etc/tempo.yml:ro
      - tatame_tempo_data:/var/tempo
    ports:
      - "3200:3200" # Query API — `curl :3200/ready`, and where Grafana reads from
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.2
    command: ["-config.file=/etc/loki.yml"]
    # Same reason as Tempo above: the image runs as uid 10001 and a fresh named
    # volume is owned by root, so Loki cannot create its chunk directories.
    user: "0"
    volumes:
      - ./infra/observability/loki.yml:/etc/loki.yml:ro
      - tatame_loki_data:/loki
    ports:
      - "3100:3100" # Query + OTLP ingest — `curl :3100/ready`, and where Grafana reads from
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle" # POST /-/reload picks up config changes
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - tatame_prom_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.0.8
    environment:
      # No login for local dev. Never do this in production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # The alert rules are provisioned here too, so they can be read and watched
      # fire against local traffic before they reach production. Mail is not:
      # SMTP stays off and the contact point points at a domain that cannot
      # exist, so a rule firing on a laptop can never email anyone. State
      # transitions are still visible under Alerting → History, and the delivery
      # that did not happen shows up in the container log as
      # `Notify for alerts failed ... SMTP not configured`. That line is the
      # proof the routing worked and only the transport was missing.
      GF_SMTP_ENABLED: "false"
      ALERT_EMAIL_TO: alertas@example.invalid
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - tatame_grafana_data:/var/lib/grafana
    ports:
      - "3300:3000" # 3000 on the host belongs to `next dev` (apps/web)
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  tatame_prom_data:
  tatame_tempo_data:
  tatame_loki_data:
  tatame_grafana_data:
